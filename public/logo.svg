<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <!-- Main gradient: light sky-blue top → deep navy bottom -->
    <linearGradient id="skyGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#5EC9F4"/>
      <stop offset="45%"  stop-color="#2B8ED4"/>
      <stop offset="100%" stop-color="#0D3B7A"/>
    </linearGradient>
    <!-- CHEMICALS text gradient -->
    <linearGradient id="chemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3CB8E8"/>
      <stop offset="100%" stop-color="#0D3B7A"/>
    </linearGradient>
    <!-- Sun stripe clip -->
    <clipPath id="sunClip">
      <circle cx="158" cy="46" r="24"/>
    </clipPath>
  </defs>

  <!-- ── SKY letters ── -->
  <text
    x="220" y="182"
    font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
    font-weight="900"
    font-size="192"
    text-anchor="middle"
    fill="url(#skyGrad)"
    letter-spacing="-4"
  >SKY</text>

  <!-- ── Sun / dot (yellow circle with horizontal white stripes) ── -->
  <circle cx="158" cy="46" r="24" fill="#F5C000"/>
  <!-- stripes clipped to circle -->
  <g clip-path="url(#sunClip)">
    <rect x="134" y="23" width="48" height="4" fill="white" opacity="0.8"/>
    <rect x="134" y="31" width="48" height="4" fill="white" opacity="0.8"/>
    <rect x="134" y="39" width="48" height="4" fill="white" opacity="0.8"/>
    <rect x="134" y="47" width="48" height="4" fill="white" opacity="0.8"/>
    <rect x="134" y="55" width="48" height="4" fill="white" opacity="0.8"/>
    <rect x="134" y="63" width="48" height="4" fill="white" opacity="0.8"/>
  </g>

  <!-- ── Horizontal rule ── -->
  <rect x="8" y="188" width="424" height="7" fill="#0D3B7A"/>

  <!-- ── CHEMICALS ── -->
  <text
    x="220" y="240"
    font-family="'Arial','Helvetica',sans-serif"
    font-weight="700"
    font-size="40"
    text-anchor="middle"
    fill="url(#chemGrad)"
    letter-spacing="10"
  >CHEMICALS</text>
</svg>
